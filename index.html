<html lang="en">
<head>

  <title>Predoo | Loadouts</title>

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 25% 30%, #4a0c0c 0%, #1a0505 45%, #090909 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    header {
      background: linear-gradient(180deg, rgba(60, 5, 5, 0.92), rgba(25, 3, 3, 0.85));
      border-bottom: 2px solid #ff3333;
      box-shadow: 0 4px 20px rgba(255, 0, 0, 0.35);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 12px #ff2a2a;
      cursor: pointer;
    }
    .meta-btn {
      background: linear-gradient(180deg, #990000, #590000);
      border: 1.5px solid #ffd700;
      color: #ffd700;
      padding: 7px 16px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 0.85rem;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.35);
      transition: 0.15s;
    }
    .meta-btn:hover {
      background: #cc0000;
      color: #ffffff;
      transform: scale(1.04);
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }
    .hub-panel {
      background: rgba(150, 15, 15, 0.22);
      backdrop-filter: blur(8px);
      border: 2px solid #ff3b3b;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(255, 30, 30, 0.4), inset 0 0 20px rgba(255, 40, 40, 0.2);
      padding: 28px;
      width: 100%;
      max-width: 780px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 600px) {
      .mode-grid { grid-template-columns: 1fr; }
    }
    .mode-card {
      background: rgba(20, 5, 5, 0.75);
      border: 2px solid rgba(255, 90, 90, 0.7);
      border-radius: 16px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .mode-card:hover {
      background: rgba(255, 40, 40, 0.3);
      border-color: #ffffff;
      transform: translateY(-4px);
      box-shadow: 0 0 22px rgba(255, 50, 50, 0.8);
    }
    .mode-title {
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      margin-bottom: 8px;
    }
    .mode-sub {
      font-size: 0.8rem;
      color: #ff9999;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 680px) {
      .category-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .cat-card {
      background: rgba(20, 5, 5, 0.65);
      border: 1.5px solid rgba(255, 90, 90, 0.6);
      border-radius: 12px;
      padding: 18px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 110px;
    }
    .cat-card:hover {
      background: rgba(255, 40, 40, 0.28);
      border-color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 0 18px rgba(255, 50, 50, 0.7);
    }
    .cat-title {
      font-weight: 900;
      font-size: 0.88rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.25;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      margin-bottom: 8px;
    }
    .cat-icon {
      height: 22px;
      opacity: 0.9;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
    }

    .view-section { display: none; }
    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      padding-bottom: 14px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .view-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ff2a2a;
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid #ff6666;
      color: #fff;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .back-btn:hover { background: #ff2a2a; }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 18px;
      background: rgba(10, 10, 10, 0.85);
      border: 1.5px solid #ff4d4d;
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-box::placeholder { color: #bbbbbb; }
    .guns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-height: 430px;
      overflow-y: auto;
      padding-right: 4px;
    }
    @media (max-width: 600px) {
      .guns-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .meta-group-title {
      grid-column: 1 / -1;
      text-align: left;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffd700;
      border-bottom: 1px solid rgba(255, 215, 0, 0.35);
      padding-bottom: 6px;
      margin-top: 14px;
      text-transform: uppercase;
    }
    .meta-group-title:first-child {
      margin-top: 0;
    }
    .gun-card {
      background: linear-gradient(180deg, #1c1010, #0e0e0e);
      border: 1.5px solid #ff4d4d;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 82px;
    }
    .gun-card:hover {
      transform: translateY(-2px);
      border-color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 50, 50, 0.65);
    }
    .tier-badge {
      display: inline-block;
      background: #ffffff;
      color: #000000;
      font-weight: 900;
      font-size: 0.68rem;
      padding: 2px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .tier-badge.meta { background: #ffd700; }
    .gun-title { font-size: 0.92rem; font-weight: 800; }
    .gun-sub { font-size: 0.72rem; color: #ff9999; margin-top: 4px; }
    
    #toast {
      visibility: hidden;
      min-width: 220px;
      background-color: #cc0000;
      color: #fff;
      text-align: center;
      border-radius: 8px;
      padding: 12px;
      position: fixed;
      z-index: 200;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-weight: bold;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
      border: 1px solid #ff9999;
    }
    #toast.show {
      visibility: visible;
      animation: fadein 0.3s, fadeout 0.3s 1.5s;
    }
    @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
    @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }

    footer {
      background: linear-gradient(0deg, rgba(60, 5, 5, 0.92), rgba(20, 2, 2, 0.8));

      justify-content: space-between;

      flex-wrap: wrap;

    .social-links a {

      text-decoration: none;
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 12px;
      border-radius: 8px;
      margin-left: 6px;
      font-weight: bold;
      font-size: 0.8rem;

</head>

      { name: "AK-47", mode: "BR", category: "Assault Rifle", rank: "", isMeta: false, code: "AK-47-1C2C4E6C8B" },
      { name: "LAG 53", mode: "BR", category: "Assault Rifle", rank: "", isMeta: false, code: "LAG 53-1C2B5E7D8B" },
      { name: "Groza", mode: "BR", category: "Assault Rifle", rank: "", isMeta: false, code: "Groza-1C2C6C7F8B" },
      { name: "Grau", mode: "BR", category: "Assault Rifle", rank: "", isMeta: false, code: "Grau5.56-1C2D4C8B9A" },
      { name: "FFAR", mode: "BR", category: "Assault Rifle", rank: "", isMeta: false, code: "FFAR 1-1F2E4B6C7E" },
      { name: "Grav", mode: "BR", category: "Assault Rifle", rank: "", isMeta: false, code: "Grav-1A2C3A7C8C" },
      { name: "Oden", mode: "BR", category: "Assault Rifle", rank: "", isMeta: false, code: "Oden-1C2C3A4C6C6C" },
      { name: "M13", mode: "BR", category: "Assault Rifle", rank: "", isMeta: false, code: "M13-1C2B4D7D9B" },
      { name: "AK117 (Red dot)", mode: "BR", category: "Assault Rifle", rank: "TOP 1 META", isMeta: true, metaRank: 1, code: "AK117-1C2C3A5E8A" },
      { name: "AK117", mode: "BR", category: "Assault Rifle", rank: "TOP 2 META", isMeta: true, metaRank: 2, code: "AK117-1C2C5E6C8B" },
      { name: "KN 44", mode: "BR", category: "Assault Rifle", rank: "", isMeta: false, code: "KN-44-1G2C3A4D7C" },
      { name: "Lachmann-556", mode: "BR", category: "Assault Rifle", rank: "", isMeta: false, code: "Lachmann-556-1C2A6C7J8B" },
      
      { name: "Hades", mode: "BR", category: "Light Machine Gun", rank: "TOP 1 META", isMeta: true, metaRank: 1, code: "Hades-2B5E6C7A8A" }
    ];

    const CATEGORY_ORDER = [
      "Assault Rifle",
      "Sub Machine Gun",
      "Light Machine Gun",
      "Shotgun",
      "Marksman Rifle",
      "Sniper Rifle",
      "Pistol"
    ];

    let activeCategory = "ALL";
    let activeMode = "MP";

    function goHome() {
      document.getElementById("mpCategoriesView").style.display = "none";
      document.getElementById("weaponView").style.display = "none";
      document.getElementById("homeView").style.display = "block";
    }

    function openMultiplayer() {
      activeMode = "MP";
      document.getElementById("homeView").style.display = "none";
      document.getElementById("weaponView").style.display = "none";
      document.getElementById("mpCategoriesView").style.display = "block";
    }

    function openBattleRoyale() {
      activeMode = "BR";
      activeCategory = "ALL";
      document.getElementById("homeView").style.display = "none";
      document.getElementById("mpCategoriesView").style.display = "none";
      document.getElementById("weaponView").style.display = "block";
      document.getElementById("categoryHeading").innerText = "BATTLE ROYALE LOADOUTS";
      document.getElementById("headerMetaBtn").innerText = "BR META";
      const searchInput = document.getElementById("gunSearchInput");
      searchInput.value = "";
      renderGuns("");
      searchInput.focus();
    }

    function backToMode() {
      if (activeMode === "BR") {
        goHome();
      } else {
        openMultiplayer();
      }
    }

    function openWeaponList(category, mode) {
      activeCategory = category;
      activeMode = mode;
      document.getElementById("mpCategoriesView").style.display = "none";
      document.getElementById("weaponView").style.display = "block";
      document.getElementById("categoryHeading").innerText = category.toUpperCase();
      document.getElementById("headerMetaBtn").innerText = "MP META";
      const searchInput = document.getElementById("gunSearchInput");
      searchInput.value = "";
      renderGuns("");
      searchInput.focus();
    }

    function openMetaView(mode) {
      activeMode = mode;
      activeCategory = "META";
      document.getElementById("homeView").style.display = "none";
      document.getElementById("mpCategoriesView").style.display = "none";
      document.getElementById("weaponView").style.display = "block";
      document.getElementById("categoryHeading").innerText =
        mode === "BR" ? "BR TOP META BY CATEGORY" : "MP TOP META BY CATEGORY";
      document.getElementById("headerMetaBtn").innerText = mode === "BR" ? "BR META" : "MP META";
      const searchInput = document.getElementById("gunSearchInput");
      searchInput.value = "";
      renderGuns("");
    }

    function filterGuns() {
      const query = document.getElementById("gunSearchInput").value.toLowerCase();
      renderGuns(query);
    }

    function createGunCard(gun) {
      const card = document.createElement("div");
      card.className = "gun-card";
      card.onclick = () => copyGunCode(gun.code, gun.name);
      const badgeHTML = gun.rank
        ? `<div class="tier-badge ${gun.isMeta ? 'meta' : ''}">${gun.rank}</div>`
        : "";
      card.innerHTML = `
        ${badgeHTML}
        <div class="gun-title">${gun.name}</div>
        <div class="gun-sub">Click to Copy Code</div>
      `;
      return card;
    }

    function renderGuns(searchQuery) {
      const grid = document.getElementById("gunsGrid");
      grid.innerHTML = "";

      if (activeCategory === "META") {
        let totalFound = 0;

        CATEGORY_ORDER.forEach(cat => {
          const catMetaGuns = GUN_DATABASE
            .filter(gun =>
              gun.mode === activeMode &&
              gun.isMeta &&
              gun.category === cat &&
              gun.name.toLowerCase().includes(searchQuery)
            )
            .sort((a, b) => (a.metaRank || 99) - (b.metaRank || 99));

          if (catMetaGuns.length > 0) {
            totalFound += catMetaGuns.length;
            const heading = document.createElement("div");
            heading.className = "meta-group-title";
            heading.innerText = cat;
            grid.appendChild(heading);

            catMetaGuns.forEach(gun => {
              grid.appendChild(createGunCard(gun));
            });
          }
        });

        if (totalFound === 0) {
          const emptyMsg = activeMode === "BR" && searchQuery === ""
            ? "Battle Royale Meta loadouts coming soon!"
            : `No ${activeMode} meta weapon found matching "${searchQuery}"`;
          grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#ff9999; font-weight:bold;">${emptyMsg}</p>`;
        }
        return;
      }

      const filtered = GUN_DATABASE.filter(gun => {
        const matchesMode = gun.mode === activeMode;
        const matchesCat = activeCategory === "ALL" || gun.category === activeCategory;
        const matchesSearch = gun.name.toLowerCase().includes(searchQuery);
        return matchesMode && matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        const emptyMsg = activeMode === "BR" && searchQuery === ""
          ? "Battle Royale loadouts coming soon!"
          : `No weapon found matching "${searchQuery}"`;
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#ff9999; font-weight:bold;">${emptyMsg}</p>`;
        return;
      }

      filtered.forEach(gun => {
        grid.appendChild(createGunCard(gun));
      });
    }

    function copyGunCode(code, gunName) {
      navigator.clipboard.writeText(code);
      showToast(`Copied ${gunName} Code!`);
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.className = "show";
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 1800);
    }
  </script>
</body>
</html>
