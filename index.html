<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ViperCODM | Loadouts</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 25% 30%, #4a0c0c 0%, #1a0505 45%, #090909 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    header {
      background: linear-gradient(180deg, rgba(60, 5, 5, 0.92), rgba(25, 3, 3, 0.85));
      border-bottom: 2px solid #ff3333;
      box-shadow: 0 4px 20px rgba(255, 0, 0, 0.35);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 12px #ff2a2a;
      cursor: pointer;
    }
    .meta-btn {
      background: linear-gradient(180deg, #990000, #590000);
      border: 1.5px solid #ff4d4d;
      color: #fff;
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 51, 51, 0.45);
      transition: 0.15s;
    }
    .meta-btn:hover { background: #cc0000; transform: scale(1.04); }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }
    .hub-panel {
      background: rgba(150, 15, 15, 0.22);
      backdrop-filter: blur(8px);
      border: 2px solid #ff3b3b;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(255, 30, 30, 0.4), inset 0 0 20px rgba(255, 40, 40, 0.2);
      padding: 28px;
      width: 100%;
      max-width: 780px;
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 680px) {
      .category-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .cat-card {
      background: rgba(20, 5, 5, 0.65);
      border: 1.5px solid rgba(255, 90, 90, 0.6);
      border-radius: 12px;
      padding: 22px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 105px;
    }
    .cat-card:hover {
      background: rgba(255, 40, 40, 0.28);
      border-color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 0 18px rgba(255, 50, 50, 0.7);
    }
    .cat-title {
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.35;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }
    .cat-count {
      font-size: 0.72rem;
      color: #ff9999;
      margin-top: 6px;
      font-weight: 600;
    }
    .weapon-view { display: none; }
    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      padding-bottom: 14px;
      margin-bottom: 16px;
    }
    .view-title {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ff2a2a;
    }
    .close-view-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid #ff6666;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
    }
    .close-view-btn:hover { background: #ff2a2a; }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 18px;
      background: rgba(10, 10, 10, 0.85);
      border: 1.5px solid #ff4d4d;
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-box::placeholder { color: #bbbbbb; }
    .guns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-height: 430px;
      overflow-y: auto;
    }
    @media (max-width: 600px) {
      .guns-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .gun-card {
      background: linear-gradient(180deg, #1c1010, #0e0e0e);
      border: 1.5px solid #ff4d4d;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
    }
    .gun-card:hover {
      transform: translateY(-2px);
      border-color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 50, 50, 0.65);
    }
    .tier-badge {
      display: inline-block;
      background: #ffffff;
      color: #000000;
      font-weight: 900;
      font-size: 0.68rem;
      padding: 2px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .tier-badge.meta { background: #ffd700; }
    .gun-title { font-size: 0.92rem; font-weight: 800; }
    .gun-sub { font-size: 0.72rem; color: #ff9999; margin-top: 4px; }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-box {
      background: linear-gradient(180deg, #240808, #110505);
      border: 2px solid #ff3b3b;
      border-radius: 16px;
      padding: 22px;
      max-width: 400px;
      width: 100%;
    }
    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .modal-top h3 { margin: 0; color: #ff4d4d; font-size: 1.15rem; }
    .attachment-list { list-style: none; padding: 0; margin: 0 0 16px 0; }
    .attachment-list li {
      background: rgba(255, 255, 255, 0.06);
      border-left: 3px solid #ff3b3b;
      padding: 8px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      font-size: 0.88rem;
    }
    .attachment-slot {
      color: #ff9999;
      font-weight: bold;
      font-size: 0.75rem;
      display: block;
      text-transform: uppercase;
    }
    .code-box {
      background: #0a0a0a;
      border: 1px dashed #ff4d4d;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }
    .copy-btn {
      background: #cc0000;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    footer {
      background: linear-gradient(0deg, rgba(60, 5, 5, 0.92), rgba(20, 2, 2, 0.8));
      border-top: 2px solid #ff3333;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
    }
    .footer-center { font-weight: 900; letter-spacing: 2px; }
    .social-links a {
      color: #ffffff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 12px;
      border-radius: 8px;
      margin-left: 6px;
      font-weight: bold;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="goHome()">VIPER</div>
    <button class="meta-btn" onclick="openCategory('META')">META</button>
  </header>

  <main>
    <div class="hub-panel">
      <div id="homeView">
        <div class="category-grid">
          <div class="cat-card" onclick="openCategory('Assault Rifle')">
            <div class="cat-title">ASSAULT<br>RIFLE</div>
            <div class="cat-count" id="count-Assault Rifle"></div>
          </div>
          <div class="cat-card" onclick="openCategory('Sub Machine Gun')">
            <div class="cat-title">SUB<br>MACHINE<br>GUN</div>
            <div class="cat-count" id="count-Sub Machine Gun"></div>
          </div>
          <div class="cat-card" onclick="openCategory('Light Machine Gun')">
            <div class="cat-title">LIGHT<br>MACHINE<br>GUN</div>
            <div class="cat-count" id="count-Light Machine Gun"></div>
          </div>
          <div class="cat-card" onclick="openCategory('Shotgun')">
            <div class="cat-title">SHOTGUN</div>
            <div class="cat-count" id="count-Shotgun"></div>
          </div>
          <div class="cat-card" onclick="openCategory('Marksman Rifle')">
            <div class="cat-title">MARKSMAN<br>RIFLE</div>
            <div class="cat-count" id="count-Marksman Rifle"></div>
          </div>
          <div class="cat-card" onclick="openCategory('Sniper Rifle')">
            <div class="cat-title">SNIPER<br>RIFLE</div>
            <div class="cat-count" id="count-Sniper Rifle"></div>
          </div>
          <div class="cat-card" onclick="openCategory('Pistol')">
            <div class="cat-title">PISTOL</div>
            <div class="cat-count" id="count-Pistol"></div>
          </div>
          <div class="cat-card" onclick="openCategory('ALL')">
            <div class="cat-title">ALL GUNS<br>(SEARCH)</div>
            <div class="cat-count">Browse All</div>
          </div>
        </div>
      </div>

      <div id="weaponView" class="weapon-view">
        <div class="view-header">
          <h2 class="view-title" id="categoryHeading">ASSAULT RIFLE</h2>
          <button class="close-view-btn" onclick="goHome()">X</button>
        </div>
        <input
          type="text"
          id="gunSearchInput"
          class="search-box"
          placeholder="Search gun name (e.g. BP50, HVK-30, QQ9)..."
          onkeyup="filterGuns()"
        />
        <div class="guns-grid" id="gunsGrid"></div>
      </div>
    </div>
  </main>

  <footer>
    <div>VIPERCODM LOADOUTS</div>
    <div class="footer-center">CALL OF DUTY MOBILE</div>
    <div class="social-links">
      <a href="#">FB</a>
      <a href="#">DISCORD</a>
      <a href="#">IG</a>
    </div>
  </footer>

  <div class="modal" id="gunModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-box">
      <div class="modal-top">
        <h3 id="modalGunName">WEAPON NAME</h3>
        <button class="close-view-btn" style="width:32px;height:32px;" onclick="closeModal()">X</button>
      </div>
      <ul class="attachment-list" id="modalAttachments"></ul>
      <div class="code-box">
        <span id="modalBuildCode">Code: VIPER-01</span>
        <button class="copy-btn" id="copyBtn" onclick="copyCode()">Copy Code</button>
      </div>
    </div>
  </div>

  <script>
    const GUN_DATABASE = [
      {
        name: "BP50",
        category: "Assault Rifle",
        rank: "TOP 1 META",
        isMeta: true,
        code: "BP50-1A2B4C8D9E",
        attachments: [
          { slot: "Muzzle", part: "Maxim Silencer" },
          { slot: "Barrel", part: "Leroy 438mm Rapid" },
          { slot: "Stock", part: "Removed Stock" },
          { slot: "Ammunition", part: "60 Round Drums" },
          { slot: "Rear Grip", part: "Stippled Grip Tape" }
        ]
      },
      {
        name: "HVK-30",
        category: "Assault Rifle",
        rank: "TOP 2 META",
        isMeta: true,
        code: "HVK30-1C2A4D8B9A",
        attachments: [
          { slot: "Muzzle", part: "Monolithic Suppressor" },
          { slot: "Barrel", part: "MIP Light" },
          { slot: "Stock", part: "YKM Combat Stock" },
          { slot: "Ammunition", part: "Large Caliber Ammo" },
          { slot: "Rear Grip", part: "Granulated Grip Tape" }
        ]
      },
      {
        name: "DR-H",
        category: "Assault Rifle",
        rank: "TOP 3",
        isMeta: true,
        code: "DRH-1A2B4C8A9A",
        attachments: [
          { slot: "Muzzle", part: "Tactical Suppressor" },
          { slot: "Barrel", part: "OWC Ranger" },
          { slot: "Stock", part: "No Stock" },
          { slot: "Ammunition", part: "25 Round OTM Mag" },
          { slot: "Rear Grip", part: "Granulated Grip Tape" }
        ]
      },
      {
        name: "STATIC-HV",
        category: "Sub Machine Gun",
        rank: "TOP 1 META",
        isMeta: true,
        code: "STATICHV-1C2A4B8A9A",
        attachments: [
          { slot: "Muzzle", part: "Monolithic Suppressor" },
          { slot: "Barrel", part: "OSW Light" },
          { slot: "Stock", part: "YKM Combat Stock" },
          { slot: "Ammunition", part: "50 Round Mag" },
          { slot: "Rear Grip", part: "Granulated Grip Tape" }
        ]
      },
      {
        name: "Switchblade X9",
        category: "Sub Machine Gun",
        rank: "TOP 2 META",
        isMeta: true,
        code: "SX9-1C2B4A8A9A",
        attachments: [
          { slot: "Muzzle", part: "Monolithic Suppressor" },
          { slot: "Barrel", part: "MIP Extended Light Barrel" },
          { slot: "Stock", part: "YKM Light Stock" },
          { slot: "Ammunition", part: "Extended Mag A" },
          { slot: "Rear Grip", part: "Granulated Grip Tape" }
        ]
      },
      {
        name: "QQ9",
        category: "Sub Machine Gun",
        rank: "TOP 3",
        isMeta: false,
        code: "QQ9-2C4C6C8B9A",
        attachments: [
          { slot: "Barrel", part: "Monolithic Integral Suppressor" },
          { slot: "Stock", part: "No Stock" },
          { slot: "Laser", part: "OWC Laser - Tactical" },
          { slot: "Ammunition", part: "45 Round Extended Mag" },
          { slot: "Rear Grip", part: "Granulated Grip Tape" }
        ]
      },
      {
        name: "MG42",
        category: "Light Machine Gun",
        rank: "TOP 1 META",
        isMeta: true,
        code: "MG42-1B2C4A8D9A",
        attachments: [
          { slot: "Muzzle", part: "Recoil Booster" },
          { slot: "Barrel", part: "VDD 682mm 31M" },
          { slot: "Stock", part: "Krausnick S91MG" },
          { slot: "Ammunition", part: "13mm Anti-Material 125 Round" },
          { slot: "Rear Grip", part: "Stippled Grip Tape" }
        ]
      },
      {
        name: "KRM-262",
        category: "Shotgun",
        rank: "TOP 1",
        isMeta: true,
        code: "KRM-1D2B4C6A9A",
        attachments: [
          { slot: "Muzzle", part: "Marauder Suppressor" },
          { slot: "Barrel", part: "Extended Barrel (+2)" },
          { slot: "Stock", part: "No Stock" },
          { slot: "Laser", part: "MIP Laser 5mW" },
          { slot: "Rear Grip", part: "Granulated Grip Tape" }
        ]
      },
      {
        name: "SKS",
        category: "Marksman Rifle",
        rank: "TOP 1 META",
        isMeta: true,
        code: "SKS-1A2A4B7A9A",
        attachments: [
          { slot: "Muzzle", part: "Tactical Suppressor" },
          { slot: "Barrel", part: "MIP Extended Light Barrel" },
          { slot: "Stock", part: "MIP Stalker Stock" },
          { slot: "Underbarrel", part: "Tactical Foregrip A" },
          { slot: "Rear Grip", part: "Granulated Grip Tape" }
        ]
      },
      {
        name: "LW3-Tundra",
        category: "Sniper Rifle",
        rank: "TOP 1 META",
        isMeta: true,
        code: "TUNDRA-1A2B4C8A9B",
        attachments: [
          { slot: "Muzzle", part: "Tactical Suppressor" },
          { slot: "Barrel", part: "28.2\" Tiger Team" },
          { slot: "Stock", part: "Bandit Steady Stock" },
          { slot: "Ammunition", part: "7 Rnd" },
          { slot: "Rear Grip", part: "Serpent Wrap" }
        ]
      },
      {
        name: "Dobvra",
        category: "Pistol",
        rank: "TOP 1",
        isMeta: true,
        code: "DOBVRA-1A2B5A8B9A",
        attachments: [
          { slot: "Muzzle", part: "Oil Can Suppressor" },
          { slot: "Barrel", part: "Sorokin 140mm Auto" },
          { slot: "Perk", part: "Akimbo" },
          { slot: "Ammunition", part: "80 Round Drums" },
          { slot: "Rear Grip", part: "Vasily's Grip" }
        ]
      }
    ];

    let activeCategory = "ALL";
    let currentCodeText = "";

    window.onload = () => {
      const categories = [
        "Assault Rifle", "Sub Machine Gun", "Light Machine Gun",
        "Shotgun", "Marksman Rifle", "Sniper Rifle", "Pistol"
      ];
      categories.forEach(cat => {
        const el = document.getElementById("count-" + cat);
        if (el) {
          const total = GUN_DATABASE.filter(g => g.category === cat).length;
          el.innerText = total + (total === 1 ? " Gun" : " Guns");
        }
      });
    };

    function openCategory(category) {
      activeCategory = category;
      document.getElementById("homeView").style.display = "none";
      document.getElementById("weaponView").style.display = "block";
      document.getElementById("categoryHeading").innerText =
        category === "ALL" ? "ALL WEAPONS" : category.toUpperCase();
      const searchInput = document.getElementById("gunSearchInput");
      searchInput.value = "";
      renderGuns("");
      searchInput.focus();
    }

    function goHome() {
      document.getElementById("weaponView").style.display = "none";
      document.getElementById("homeView").style.display = "block";
    }

    function filterGuns() {
      const query = document.getElementById("gunSearchInput").value.toLowerCase();
      renderGuns(query);
    }

    function renderGuns(searchQuery) {
      const grid = document.getElementById("gunsGrid");
      grid.innerHTML = "";
      const filtered = GUN_DATABASE.filter(gun => {
        const matchesCat =
          activeCategory === "ALL" ||
          (activeCategory === "META" && gun.isMeta) ||
          gun.category === activeCategory;
        const matchesName = gun.name.toLowerCase().includes(searchQuery);
        return matchesCat && matchesName;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#ff9999;">No weapon found matching "${searchQuery}".</p>`;
        return;
      }

      filtered.forEach(gun => {
        const card = document.createElement("div");
        card.className = "gun-card";
        card.onclick = () => openGunModal(gun);
        card.innerHTML = `
          <div class="tier-badge ${gun.isMeta ? 'meta' : ''}">${gun.rank}</div>
          <div class="gun-title">${gun.name}</div>
          <div class="gun-sub">${gun.category}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openGunModal(gun) {
      document.getElementById("modalGunName").innerText = gun.name + " — GUNSMITH";
      const list = document.getElementById("modalAttachments");
      list.innerHTML = "";
      gun.attachments.forEach(att => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="attachment-slot">${att.slot}</span>${att.part}`;
        list.appendChild(li);
      });
      currentCodeText = gun.code;
      document.getElementById("modalBuildCode").innerText = "Code: " + gun.code;
      document.getElementById("copyBtn").innerText = "Copy Code";
      document.getElementById("gunModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("gunModal").style.display = "none";
    }

    function copyCode() {
      navigator.clipboard.writeText(currentCodeText);
      document.getElementById("copyBtn").innerText = "Copied!";
    }
  </script>
</body>
</html>
