<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ViperCODM | Loadouts</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 25% 30%, #4a0c0c 0%, #1a0505 45%, #090909 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    header {
      background: linear-gradient(180deg, rgba(60, 5, 5, 0.92), rgba(25, 3, 3, 0.85));
      border-bottom: 2px solid #ff3333;
      box-shadow: 0 4px 20px rgba(255, 0, 0, 0.35);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 12px #ff2a2a;
      cursor: pointer;
    }
    .meta-btn {
      background: linear-gradient(180deg, #990000, #590000);
      border: 1.5px solid #ff4d4d;
      color: #fff;
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 51, 51, 0.45);
      transition: 0.15s;
    }
    .meta-btn:hover { background: #cc0000; transform: scale(1.04); }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }
    .hub-panel {
      background: rgba(150, 15, 15, 0.22);
      backdrop-filter: blur(8px);
      border: 2px solid #ff3b3b;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(255, 30, 30, 0.4), inset 0 0 20px rgba(255, 40, 40, 0.2);
      padding: 28px;
      width: 100%;
      max-width: 780px;
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 680px) {
      .category-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .cat-card {
      background: rgba(20, 5, 5, 0.65);
      border: 1.5px solid rgba(255, 90, 90, 0.6);
      border-radius: 12px;
      padding: 18px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 110px;
    }
    .cat-card:hover {
      background: rgba(255, 40, 40, 0.28);
      border-color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 0 18px rgba(255, 50, 50, 0.7);
    }
    .cat-title {
      font-weight: 900;
      font-size: 0.88rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.25;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      margin-bottom: 8px;
    }
    .cat-icon {
      height: 22px;
      opacity: 0.9;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
    }
    .weapon-view { display: none; }
    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      padding-bottom: 14px;
      margin-bottom: 16px;
    }
    .view-title {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ff2a2a;
    }
    .close-view-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid #ff6666;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
    }
    .close-view-btn:hover { background: #ff2a2a; }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 18px;
      background: rgba(10, 10, 10, 0.85);
      border: 1.5px solid #ff4d4d;
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-box::placeholder { color: #bbbbbb; }
    .guns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-height: 430px;
      overflow-y: auto;
    }
    @media (max-width: 600px) {
      .guns-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .gun-card {
      background: linear-gradient(180deg, #1c1010, #0e0e0e);
      border: 1.5px solid #ff4d4d;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
      position: relative;
    }
    .gun-card:hover {
      transform: translateY(-2px);
      border-color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 50, 50, 0.65);
    }
    .tier-badge {
      display: inline-block;
      background: #ffffff;
      color: #000000;
      font-weight: 900;
      font-size: 0.68rem;
      padding: 2px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .tier-badge.meta { background: #ffd700; }
    .gun-title { font-size: 0.92rem; font-weight: 800; }
    .gun-sub { font-size: 0.72rem; color: #ff9999; margin-top: 4px; }
    
    /* Toast Notification for Copy */
    #toast {
      visibility: hidden;
      min-width: 220px;
      background-color: #cc0000;
      color: #fff;
      text-align: center;
      border-radius: 8px;
      padding: 12px;
      position: fixed;
      z-index: 200;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-weight: bold;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
      border: 1px solid #ff9999;
    }
    #toast.show {
      visibility: visible;
      animation: fadein 0.3s, fadeout 0.3s 1.5s;
    }
    @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
    @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }

    footer {
      background: linear-gradient(0deg, rgba(60, 5, 5, 0.92), rgba(20, 2, 2, 0.8));
      border-top: 2px solid #ff3333;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
    }
    .footer-center { font-weight: 900; letter-spacing: 2px; }
    .social-links a {
      color: #ffffff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 12px;
      border-radius: 8px;
      margin-left: 6px;
      font-weight: bold;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="goHome()">VIPER</div>
    <button class="meta-btn" onclick="openCategory('META')">META</button>
  </header>

  <main>
    <div class="hub-panel">
      <div id="homeView">
        <div class="category-grid">
          <div class="cat-card" onclick="openCategory('Assault Rifle')">
            <div class="cat-title">ASSAULT<br>RIFLE</div>
            <svg class="cat-icon" viewBox="0 0 24 24" fill="white"><path d="M3,11H21V13H3V11M2,14H22V16H2V14M5,8H19V10H5V8Z"/></svg>
          </div>
          <div class="cat-card" onclick="openCategory('Sub Machine Gun')">
            <div class="cat-title">SUB<br>MACHINE GUN</div>
            <svg class="cat-icon" viewBox="0 0 24 24" fill="white"><path d="M2,11H22V13H2V11M4,14H20V16H4V14Z"/></svg>
          </div>
          <div class="cat-card" onclick="openCategory('Light Machine Gun')">
            <div class="cat-title">LIGHT<br>MACHINE GUN</div>
            <svg class="cat-icon" viewBox="0 0 24 24" fill="white"><path d="M1,10H23V13H1V10M3,14H21V16H3V14Z"/></svg>
          </div>
          <div class="cat-card" onclick="openCategory('Shotgun')">
            <div class="cat-title">SHOTGUN</div>
            <svg class="cat-icon" viewBox="0 0 24 24" fill="white"><path d="M2,11H22V14H2V11M5,15H19V17H5V15Z"/></svg>
          </div>
          <div class="cat-card" onclick="openCategory('Marksman Rifle')">
            <div class="cat-title">MARKSMAN<br>RIFLE</div>
            <svg class="cat-icon" viewBox="0 0 24 24" fill="white"><path d="M2,11H22V13H2V11M3,14H21V16H3V14Z"/></svg>
          </div>
          <div class="cat-card" onclick="openCategory('Sniper Rifle')">
            <div class="cat-title">SNIPER<br>RIFLE</div>
            <svg class="cat-icon" viewBox="0 0 24 24" fill="white"><path d="M1,10H23V13H1V10M2,14H22V16H2V14Z"/></svg>
          </div>
          <div class="cat-card" onclick="openCategory('Pistol')">
            <div class="cat-title">PISTOL</div>
            <svg class="cat-icon" viewBox="0 0 24 24" fill="white"><path d="M6,11H18V14H6V11M8,15H16V17H8V15Z"/></svg>
          </div>
        </div>
      </div>

      <div id="weaponView" class="weapon-view">
        <div class="view-header">
          <h2 class="view-title" id="categoryHeading">ASSAULT RIFLE</h2>
          <button class="close-view-btn" onclick="goHome()">X</button>
        </div>
        <input
          type="text"
          id="gunSearchInput"
          class="search-box"
          placeholder="Search gun name (e.g. BP50, HVK-30, QQ9)..."
          onkeyup="filterGuns()"
        />
        <div class="guns-grid" id="gunsGrid"></div>
      </div>
    </div>
  </main>

  <!-- Notification Toast -->
  <div id="toast">Copied Build Code!</div>

  <footer>
    <div>VIPERCODM LOADOUTS</div>
    <div class="footer-center">CALL OF DUTY MOBILE</div>
    <div class="social-links">
      <a href="#">FB</a>
      <a href="#">DISCORD</a>
     <a href="https://www.instagram.com/peerrdddd?rpxt=MXRycmlob3h0dnA2eg==" target="_blank">IG</a>
    </div>
  </footer>

  <script>
    const GUN_DATABASE = [
      { name: "BP50", category: "Assault Rifle", rank: "TOP 1 META", isMeta: true, code: "BP50-1A2B4C8D9E" },
      { name: "HVK-30", category: "Assault Rifle", rank: "TOP 2 META", isMeta: true, code: "HVK30-1C2A4D8B9A" },
      { name: "DR-H", category: "Assault Rifle", rank: "TOP 3", isMeta: true, code: "DRH-1A2B4C8A9A" },
      { name: "STATIC-HV", category: "Sub Machine Gun", rank: "TOP 1 META", isMeta: true, code: "STATICHV-1C2A4B8A9A" },
      { name: "Switchblade X9", category: "Sub Machine Gun", rank: "TOP 2 META", isMeta: true, code: "SX9-1C2B4A8A9A" },
      { name: "QQ9", category: "Sub Machine Gun", rank: "TOP 3", isMeta: false, code: "QQ9-2C4C6C8B9A" },
      { name: "MG42", category: "Light Machine Gun", rank: "TOP 1 META", isMeta: true, code: "MG42-1B2C4A8D9A" },
      { name: "KRM-262", category: "Shotgun", rank: "TOP 1", isMeta: true, code: "KRM-1D2B4C6A9A" },
      { name: "SKS", category: "Marksman Rifle", rank: "TOP 1 META", isMeta: true, code: "SKS-1A2A4B7A9A" },
      { name: "LW3-Tundra", category: "Sniper Rifle", rank: "TOP 1 META", isMeta: true, code: "TUNDRA-1A2B4C8A9B" },
      { name: "Dobvra", category: "Pistol", rank: "TOP 1", isMeta: true, code: "DOBVRA-1A2B5A8B9A" }
    ];

    let activeCategory = "Assault Rifle";

    function openCategory(category) {
      activeCategory = category;
      document.getElementById("homeView").style.display = "none";
      document.getElementById("weaponView").style.display = "block";
      document.getElementById("categoryHeading").innerText = category === "META" ? "META WEAPONS" : category.toUpperCase();
      const searchInput = document.getElementById("gunSearchInput");
      searchInput.value = "";
      renderGuns("");
      searchInput.focus();
    }

    function goHome() {
      document.getElementById("weaponView").style.display = "none";
      document.getElementById("homeView").style.display = "block";
    }

    function filterGuns() {
      const query = document.getElementById("gunSearchInput").value.toLowerCase();
      renderGuns(query);
    }

    function renderGuns(searchQuery) {
      const grid = document.getElementById("gunsGrid");
      grid.innerHTML = "";
      const filtered = GUN_DATABASE.filter(gun => {
        const matchesCat =
          activeCategory === "META" ? gun.isMeta : gun.category === activeCategory;
        const matchesName = gun.name.toLowerCase().includes(searchQuery);
        return matchesCat && matchesName;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#ff9999;">No weapon found matching "${searchQuery}".</p>`;
        return;
      }

      filtered.forEach(gun => {
        const card = document.createElement("div");
        card.className = "gun-card";
        card.onclick = () => copyGunCode(gun.code, gun.name);
        card.innerHTML = `
          <div class="tier-badge ${gun.isMeta ? 'meta' : ''}">${gun.rank}</div>
          <div class="gun-title">${gun.name}</div>
          <div class="gun-sub">Click to Copy Code</div>
        `;
        grid.appendChild(card);
      });
    }

    function copyGunCode(code, gunName) {
      navigator.clipboard.writeText(code);
      showToast(`Copied ${gunName} Code!`);
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.className = "show";
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 1800);
    }
  </script>
</body>
</html>
