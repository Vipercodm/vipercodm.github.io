<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ViperCODM | Meta Loadouts</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 25% 30%, #4a0c0c 0%, #1a0505 45%, #090909 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Header */
    header {
      background: linear-gradient(180deg, rgba(60, 5, 5, 0.92), rgba(25, 3, 3, 0.85));
      border-bottom: 2px solid #ff3333;
      box-shadow: 0 4px 20px rgba(255, 0, 0, 0.35);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 12px #ff2a2a;
      cursor: pointer;
    }
    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .meta-btn {
      background: linear-gradient(180deg, #990000, #590000);
      border: 1.5px solid #ff4d4d;
      color: #fff;
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 51, 51, 0.45);
      transition: 0.15s;
    }
    .meta-btn:hover {
      background: #cc0000;
      transform: scale(1.04);
    }

    /* Main Center Area */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }

    /* Red Glass Panel (Matches Chizkodem Hub) */
    .hub-panel {
      background: rgba(150, 15, 15, 0.22);
      backdrop-filter: blur(8px);
      border: 2px solid #ff3b3b;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(255, 30, 30, 0.4), inset 0 0 20px rgba(255, 40, 40, 0.2);
      padding: 28px;
      width: 100%;
      max-width: 780px;
    }

    /* Category Grid on Home */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 680px) {
      .category-grid { grid-template-columns: repeat(2, 1fr); }
    }
